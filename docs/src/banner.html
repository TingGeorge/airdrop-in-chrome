<!doctype html>
<html><head><meta charset="utf-8"><style>
  html, body { margin: 0; }
  body { width: 1280px; height: 420px; font-family: Inter, -apple-system, sans-serif; overflow: hidden;
    background: radial-gradient(1200px 500px at 85% 120%, #5ac8fa55, transparent 60%),
                linear-gradient(135deg, #0b1d3a 0%, #0a3d91 55%, #0a84ff 100%); color: #fff; position: relative; }
  .rings { position: absolute; right: -120px; top: 50%; transform: translateY(-50%); }
  .rings div { position: absolute; border: 2px solid rgba(255,255,255,.12); border-radius: 50%; transform: translate(-50%,-50%); }
  .wrap { position: absolute; left: 96px; top: 50%; transform: translateY(-50%); display: flex; gap: 40px; align-items: center; }
  img { width: 168px; height: 168px; filter: drop-shadow(0 18px 40px rgba(0,0,0,.35)); }
  h1 { font-size: 68px; font-weight: 800; margin: 0; letter-spacing: -2px; }
  p { font-size: 26px; margin: 10px 0 26px; color: #d6e6ff; font-weight: 500; }
  .chips { display: flex; gap: 12px; }
  .chip { padding: 8px 16px; border-radius: 999px; background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.22);
    font-size: 18px; font-weight: 600; }
</style></head><body>
  <div class="rings">
    <div style="width:300px;height:300px"></div><div style="width:520px;height:520px"></div>
    <div style="width:740px;height:740px"></div><div style="width:960px;height:960px"></div>
  </div>
  <div class="wrap">
    <img src="icon/icon.svg" alt="">
    <div>
      <h1>Share via AirDrop</h1>
      <p>Safari's AirDrop button, now in Google Chrome on macOS.</p>
      <div class="chips"><span class="chip">One-click share</span><span class="chip">Paste any link</span><span class="chip">⌥ ⇧ A shortcut</span><span class="chip">Chrome · Brave · Edge · Arc</span></div>
    </div>
  </div>
</body></html>

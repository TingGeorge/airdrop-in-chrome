name: Release

# Publishes a GitHub Release whenever main has a version (extension/manifest.json)
# that hasn't been released yet. To ship a new version, bump the version in
# extension/manifest.json and hostVersion in native-host/AirDropHost.swift.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/build.yml

  release:
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(scripts/version.sh)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "Release v$version already exists; nothing to do."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # Publish exactly the bundle CI built and tested.
      - name: Download tested bundle
        if: steps.version.outputs.exists == 'false'
        uses: actions/download-artifact@v4
        with:
          name: release-bundle
          path: dist

      - name: Publish release
        if: steps.version.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cat > notes.md <<NOTES
          ## Install

          1. Download **airdrop-in-chrome-v$VERSION.zip** below and unzip it.
          2. In Terminal, run \`./install.sh\` from the unzipped \`airdrop-in-chrome\` folder. It includes a prebuilt helper (Apple silicon + Intel), so you don't need Xcode.
          3. In \`chrome://extensions\`, turn on **Developer mode**, click **Load unpacked**, and choose the \`extension\` folder.

          \`share-via-airdrop-extension-v$VERSION.zip\` contains only the extension, for uploading to the Chrome Web Store.
          NOTES
          gh release create "v$VERSION" dist/*.zip \
            --target "$GITHUB_SHA" \
            --title "Share via AirDrop v$VERSION" \
            --notes-file notes.md \
            --generate-notes
